  our_mission_3: "ភាពជាដៃគូអន្តរជាតិ និងក្នុងស្រុក"
  our_mission_3_des: "ធ្វើការជាមួយស្ថាប័នទាំងក្នុងស្រុក និងទូទាំងពិភពលោក ដើម្បីចែករំលែកចំណេះដឹង និងធ្វើការបណ្តុះបណ្តាលបច្ចេកវិទ្យាកម្រិតខ្ពស់។"
