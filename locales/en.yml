  our_mission_2_des: "Facilitate the adoption of Al, robotics, and smart cities through effective business practices and technology transfer."
  our_mission_3: "International and Domestic Partnerships"
  our_mission_3_des: "Work with institutions both locally and globally to share knowledge and conduct advanced technology training."
  our_mission_4: "Human Resource Development"
  our_mission_4_des: "Assist in the mobilization and development of skilled professionals in Al, robotics, and smart cities to support Cambodia's technological advancement."
  our_mission_5: "Economic Growth"
  our_mission_5_des: "Contribute to the rapid growth of the national economy by promoting innovative practices and fostering a collaborative environment."

  our_vision: "Our Vision"
  our_vision_1: "To advance Cambodia's technological landscape by collaborating with the government to enhance education and training in high technology, promoting the effective integration of Al, robotics, and smart cities, and fostering a culture of participation that drives economic and social development."
  our_vision_2: "Empowering a digitally inclusive society where every Cambodian can access the benefits of emerging technology."
  our_vision_3: "Positioning Cambodia as a regional hub for AI, robotics, and smart-city innovation."

