about:
  intro_eyebrow: "About CARTA"
  intro_des: "The Cambodia AI Robotics and Technology Transfer Association (CARTA) drives technological advancement by uniting government, industry, and academia."
  purpose_eyebrow: "Our purpose"
  purpose_title: "Mission & Vision"
  about_the_association: "About The Association"
  about_1: "The Cambodia Al Robotics and Technology Transfer Association (CARTA) is committed to driving technological advancement in Cambodia. We collaborate with the government to promote education and training in high technology, facilitating the exchange of expertise that is essential for the nation's growth."
  about_2: "Our goal is to foster strong cooperation between industry and government, ensuring the seamless implementation of artificial intelligence (AI), robotics, smart cities, and technology transfer. These initiatives are designed to stimulate economic and social development, positioning Cambodia as a key player in the regional tech landscape."
  about_3: "CARTA also works to organize and support agents and traders across the country, helping them fulfill business obligations effectively. By promoting a culture of participation and innovation, we aim to accelerate the growth of the national economy, making it more resilient and dynamic."
  about_4: "We are dedicated to driving technological advancement and economic growth by fostering Knowledge, building a strong Network, creating vibrant Marketplace opportunities, and exemplifying Leadership in all our initiatives."
  about_5: "Through our efforts, CARTA is building a future where technology and collaboration are at the heart of Cambodia's progress, driving sustainable development for the benefit of all."

  hero_badge_title: "Uniting Government, Industry & Academia"
  hero_badge_des: "A national platform for AI, robotics, and technology transfer in Cambodia."
