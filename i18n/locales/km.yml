  our_vision_1: "ដើម្បីជំរុញទិដ្ឋភាពបច្ចេកវិទ្យារបស់កម្ពុជា ដោយសហការជាមួយរដ្ឋាភិបាល ដើម្បីបង្កើនការអប់រំ និងបណ្តុះបណ្តាលផ្នែកបច្ចេកវិទ្យាខ្ពស់ លើកកម្ពស់ការរួមបញ្ចូលប្រកបដោយប្រសិទ្ធភាពនៃទីក្រុង Al, មនុស្សយន្ត និងទីក្រុងឆ្លាតវៃ និងជំរុញវប្បធម៌នៃការចូលរួមដែលជំរុញការអភិវឌ្ឍសេដ្ឋកិច្ច និងសង្គម។"

