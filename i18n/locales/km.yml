home:
  features:
    knowledge: "ចំណេះដឹង"
    knowledge_des: "យើងប្តេជ្ញាជំរុញជំនាញបច្ចេកវិទ្យា និងការយល់ដឹងអំពីឧស្សាហកម្ម ដោយផ្តល់ឱ្យសមាជិករបស់យើងនូវព័ត៌មាន និងធនធានដ៏មានតម្លៃ ដើម្បីបន្តទៅមុខក្នុងវិស័យរបស់ពួកគេ។"
    network: "បណ្តាញ"
    network_des: "យើងកសាង និងនិរន្តរភាពទំនាក់ទំនងដ៏រឹងមាំនៅក្នុងប្រទេសកម្ពុជា និងទូទាំងតំបន់ ដោយជួយសម្រួលដល់ការចូលទៅកាន់បណ្តាញដ៏ធំទូលាយនៃដៃគូ និងឱកាសក្នុងស្រុក និងអន្តរជាតិ។"
    marketplace: "ទីផ្សារ"
    marketplace_des: "យើងបង្កើត និងគាំទ្រវេទិកាថាមវន្តសម្រាប់ការចូលរួម ដោយផ្តល់ជូនសមាជិករបស់យើងនូវកន្លែងមួយដើម្បីបង្ហាញពីការច្នៃប្រឌិតរបស់ពួកគេ ស្វែងរកទីផ្សារថ្មីៗ និងភ្ជាប់ទំនាក់ទំនងជាមួយអតិថិជនសក្តានុពល និងអ្នកសហការ។"
    leadership: "ភាពជាអ្នកដឹកនាំ"
    leadership_des: "យើងដឹកនាំដោយចក្ខុវិស័យ និងសុចរិតភាព ដោយណែនាំសមាជិករបស់យើងតាមរយៈគំនិតផ្តួចផ្តើមជាយុទ្ធសាស្រ្ត និងជំរុញវប្បធម៌នៃឧត្តមភាពដែលជំរុញឱ្យមានការរីកចម្រើន និងការអភិវឌ្ឍន៍នៅក្នុងបច្ចេកវិទ្យា និងអាជីវកម្ម។"

