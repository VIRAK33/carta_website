  our_mission_2: "លើកកម្ពស់ការអនុវត្តបច្ចេកវិទ្យា"
  our_mission_2_des: "សម្រួលដល់ការទទួលយក Al, មនុស្សយន្ត និងទីក្រុងឆ្លាតវៃ តាមរយៈការអនុវត្តអាជីវកម្មប្រកបដោយប្រសិទ្ធភាព និងការផ្ទេរបច្ចេកវិទ្យា។"
  our_mission_3: "ភាពជាដៃគូអន្តរជាតិ និងក្នុងស្រុក"
  our_mission_3_des: "ធ្វើការជាមួយស្ថាប័នទាំងក្នុងស្រុក និងទូទាំងពិភពលោក ដើម្បីចែករំលែកចំណេះដឹង និងធ្វើការបណ្តុះបណ្តាលបច្ចេកវិទ្យាកម្រិតខ្ពស់។"
  our_mission_4: "ការអភិវឌ្ឍន៍ធនធានមនុស្ស"
  our_mission_4_des: "ជួយក្នុងការកៀរគរ និងអភិវឌ្ឍអ្នកជំនាញដែលមានជំនាញនៅក្នុងទីក្រុង Al, មនុស្សយន្ត និងទីក្រុងឆ្លាតវៃ ដើម្បីគាំទ្រដល់ការរីកចម្រើនផ្នែកបច្ចេកវិទ្យារបស់កម្ពុជា។"
  our_mission_5: "កំណើនសេដ្ឋកិច្ច"
  our_mission_5_des: "រួមចំណែកដល់ការរីកលូតលាស់យ៉ាងឆាប់រហ័សនៃសេដ្ឋកិច្ចជាតិដោយការលើកកម្ពស់ការអនុវត្តប្រកបដោយភាពច្នៃប្រឌិត និងជំរុញបរិយាកាសសហការ។"

