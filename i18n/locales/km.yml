membership:
  title: "សមាជិក"
  corporate_membership: "Corporate Membership"
  corporate_membership_des: "រចនាឡើងសម្រាប់អាជីវកម្មដែលកំពុងស្វែងរកការរួមបញ្ចូលបច្ចេកវិជ្ជាទំនើប ទទួលបានការចូលទៅកាន់ព្រឹត្តិការណ៍ផ្តាច់មុខ និងសហការលើគម្រោងច្នៃប្រឌិត។ សមាជិកសាជីវកម្មទទួលបានអត្ថប្រយោជន៍ពីឱកាសបណ្តាញ ការយល់ដឹងអំពីឧស្សាហកម្ម និងសេវាកម្មប្រឹក្សាយោបល់ដែលតម្រូវតាមតម្រូវការ។"
  professional_membership: "Professional Membership"
  professional_membership_des: "រចនាឡើងសម្រាប់បុគ្គលដែលធ្វើការក្នុងវិស័យបច្ចេកវិទ្យា ដែលស្វែងរកការស្នាក់នៅជួរមុខនៃនិន្នាការឧស្សាហកម្ម បង្កើនជំនាញរបស់ពួកគេ និងភ្ជាប់ទំនាក់ទំនងជាមួយមិត្តភក្ដិ។ សមាជិកដែលមានជំនាញវិជ្ជាជីវៈអាចចូលទៅកាន់សិក្ខាសាលា វគ្គបណ្តុះបណ្តាល និងបណ្តាញអ្នកជំនាញក្នុងឧស្សាហកម្ម។"
  associate_membership: "Associate Membership"
  associate_membership_des: "ល្អបំផុតសម្រាប់អង្គការ និងបុគ្គលដែលចាប់អារម្មណ៍ក្នុងការគាំទ្របេសកកម្មរបស់ CARTA និងចូលរួមក្នុងគំនិតផ្តួចផ្តើមរបស់យើង។ សមាជិកសហការចូលរួមនៅក្នុងព្រឹត្តិការណ៍ ទទួលបានព័ត៌មានថ្មីៗអំពីការអភិវឌ្ឍន៍ឧស្សាហកម្ម និងមានឱកាសក្នុងការរួមចំណែកដល់គម្រោងសហការ។"

