about:
  about_the_association: "អំពីសមាគម"
  about_1: "សមាគម Cambodia AI Robotics and Technology Transfer Association (CARTA) បានប្តេជ្ញាចិត្តក្នុងការជំរុញភាពជឿនលឿនផ្នែកបច្ចេកវិទ្យានៅកម្ពុជា។ យើងសហការជាមួយរដ្ឋាភិបាលក្នុងការលើកកម្ពស់ការអប់រំ និងការបណ្តុះបណ្តាលផ្នែកបច្ចេកវិទ្យាខ្ពស់ សម្របសម្រួលការផ្លាស់ប្តូរជំនាញដែលមានសារៈសំខាន់សម្រាប់ការរីកចម្រើនរបស់ប្រទេសជាតិ។"
  about_2: "គោលដៅរបស់យើងគឺដើម្បីជំរុញកិច្ចសហប្រតិបត្តិការដ៏រឹងមាំរវាងឧស្សាហកម្ម និងរដ្ឋាភិបាល ធានានូវការអនុវត្តប្រកបដោយភាពរលូននៃបញ្ញាសិប្បនិម្មិត (AI) មនុស្សយន្ត ទីក្រុងឆ្លាតវៃ និងការផ្ទេរបច្ចេកវិទ្យា។ គំនិតផ្តួចផ្តើមទាំងនេះត្រូវបានរៀបចំឡើងដើម្បីជំរុញការអភិវឌ្ឍន៍សេដ្ឋកិច្ច និងសង្គម ដោយដាក់ឱ្យប្រទេសកម្ពុជាជា តួអង្គសំខាន់នៅក្នុងទេសភាពបច្ចេកវិទ្យាក្នុងតំបន់"
  about_3: "CARTA ក៏ធ្វើការដើម្បីរៀបចំ និងគាំទ្រភ្នាក់ងារ និងពាណិជ្ជករទូទាំងប្រទេស ដោយជួយពួកគេបំពេញកាតព្វកិច្ចអាជីវកម្មប្រកបដោយប្រសិទ្ធភាព។ តាមរយៈការលើកកម្ពស់វប្បធម៌នៃការចូលរួម និងការច្នៃប្រឌិត យើងមានគោលបំណងបង្កើនល្បឿនកំណើនសេដ្ឋកិច្ចជាតិ ធ្វើឱ្យវាកាន់តែមានភាពធន់ និងថាមពល។"
  about_4: "យើងប្តេជ្ញាជំរុញឱ្យមានការជឿនលឿនផ្នែកបច្ចេកវិទ្យា និងកំណើនសេដ្ឋកិច្ច តាមរយៈការជំរុញចំណេះដឹង បង្កើតបណ្តាញដ៏រឹងមាំ បង្កើតឱកាសទីផ្សារដ៏រស់រវើក និងជាគំរូនៃភាពជាអ្នកដឹកនាំនៅក្នុងគំនិតផ្តួចផ្តើមរបស់យើងទាំងអស់។"
  about_5: "តាមរយៈកិច្ចខិតខំប្រឹងប្រែងរបស់យើង CARTA កំពុងកសាងអនាគតមួយដែលបច្ចេកវិទ្យា និងការសហការជាស្នូលនៃវឌ្ឍនភាពរបស់ប្រទេសកម្ពុជា ជំរុញការអភិវឌ្ឍន៍ប្រកបដោយនិរន្តរភាពសម្រាប់ជាប្រយោជន៍ដល់ all.rk ការបង្កើតឱកាសទីផ្សារដ៏រស់រវើក និងជាគំរូនៃភាពជាអ្នកដឹកនាំនៅក្នុងគំនិតផ្តួចផ្តើមរបស់យើងទាំងអស់។"

  our_mission: "បេសកកម្មរបស់យើង"
  our_mission_1: "កិច្ចសហការរបស់រដ្ឋាភិបាល"
