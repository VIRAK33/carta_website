  industry_partnerships: "ឧស្សាហកម្ម"
  industry_partnerships_des: "យើងធ្វើការយ៉ាងជិតស្និទ្ធជាមួយក្រុមហ៊ុនឈានមុខគេ និងអង្គការឧស្សាហកម្មដើម្បីជំរុញការទទួលយក AI, មនុស្សយន្ត និងទីក្រុងឆ្លាតវៃ។ ភាពជាដៃគូទាំងនេះផ្តល់នូវអត្ថប្រយោជន៍ទៅវិញទៅមកតាមរយៈគម្រោងរួមគ្នា គំនិតផ្តួចផ្តើមស្រាវជ្រាវ និងធនធានរួមគ្នា។"
